name: bus484 check
on:
  push:
    paths: ["bus484/**", "tests/bus484/**", ".github/workflows/bus484-check.yml"]
  pull_request:
    paths: ["bus484/**", "tests/bus484/**"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd tests/bus484 && npm install --no-audit --no-fund
      - run: tests/bus484/check.sh
