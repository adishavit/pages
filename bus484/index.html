<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Line 484 live – Tel Aviv → Mevaseret Zion</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,sans-serif}
  #map{position:absolute;inset:0 0 168px 0}
  #panel{position:absolute;left:0;right:0;bottom:0;height:168px;background:#fff;border-top:1px solid #ccc;
    padding:8px 12px calc(8px + env(safe-area-inset-bottom));box-sizing:border-box;overflow:auto;font-size:14px}
  #status{font-size:12px;color:#555;margin-bottom:6px}
  #status.err{color:#b00020}
  .bus{padding:4px 0;border-top:1px solid #eee}
  .bus b{font-size:15px}
  .stale{color:#b00020}
  .stoplbl{background:#fff;border:1px solid #888;border-radius:3px;padding:0 3px;font-size:11px;white-space:nowrap;direction:rtl}
  .stoplbl.k{background:#ffe08a;border-color:#c60;font-weight:700}
  .busicon{background:#d32f2f;color:#fff;border:2px solid #fff;border-radius:50%;width:26px;height:26px;
    line-height:22px;text-align:center;font-weight:700;font-size:11px;box-shadow:0 0 4px #000}
  #ver{font-size:11px;color:#666;margin-bottom:4px}
  #panel.big{height:60vh} #map.big{bottom:60vh}
  details{margin-top:6px} summary{font-size:12px;color:#06c}
  #dbg{font:11px/1.35 ui-monospace,monospace;white-space:pre-wrap;word-break:break-all;background:#f5f5f5;padding:6px;margin:4px 0}
  button{font-size:13px;padding:4px 10px;margin-left:6px}
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <div id="ver"></div>
  <div id="status">Loading…</div>
  <div id="buses"></div>
  <details id="dbgwrap"><summary>Debug log</summary>
    <button onclick="copyLog()">Copy log</button>
    <pre id="dbg"></pre>
  </details>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const VERSION = "v3";
const BUILD = "2026-11-24T16:25:49Z";   // UTC time this file was built/pushed
const PAGE_LOADED = Date.now();
const LOG = [];
function log(msg){
  const t = new Date().toISOString().slice(11,23);
  LOG.push(t+" "+msg); if(LOG.length>400) LOG.shift();
  const el=document.getElementById("dbg"); if(el) el.textContent=LOG.join("\n");
}
function copyLog(){
  const txt = verLine()+"\n"+LOG.join("\n");
  if(navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>log("log copied"),()=>log("copy failed"));
  else log("clipboard unavailable: select the text manually");
}
function fmt(sec){sec=Math.floor(sec);const m=Math.floor(sec/60);return m? m+"m"+(sec%60)+"s" : sec+"s";}
function verLine(){
  const buildAge=(Date.now()-new Date(BUILD).getTime())/1000;
  return `${VERSION} · built ${BUILD} (${fmt(buildAge)} ago) · page opened ${fmt((Date.now()-PAGE_LOADED)/1000)} ago`;
}
setInterval(()=>{const e=document.getElementById("ver"); if(e) e.textContent=verLine();},1000);
document.getElementById("dbgwrap").addEventListener("toggle",e=>{
  for(const id of ["panel","map"]) document.getElementById(id).classList.toggle("big",e.target.open);
  map.invalidateSize();
});
window.addEventListener("error",e=>log("JS error: "+e.message+" @"+(e.lineno||"?")));
window.addEventListener("unhandledrejection",e=>log("Unhandled rejection: "+(e.reason&&e.reason.message||e.reason)));
log(`start ${VERSION} build=${BUILD}`);
log(`UA: ${navigator.userAgent}`);
log(`online=${navigator.onLine} tz=${Intl.DateTimeFormat().resolvedOptions().timeZone} now=${new Date().toISOString()} origin=${location.origin}`);

const API = "https://open-bus-stride-api.hasadna.org.il";
const LINE_REF = 19094;            // line 484, Tel Aviv Savidor -> Mevaseret Zion (Tnufa), looked up for 2026-11-24
const REFRESH_MS = 60000;
const WINDOW_MIN = 15;             // how far back to look for fixes
const STALE_MIN = 5;               // flag a bus whose last fix is older than this

// Stops from GTFS ride 164125712 (2026-11-24). Used as a fallback; refreshed from the API at load.
let stops = [
 [1,"ת. רכבת תל אביב- סבידור/רציפים A",32.083157,34.796089],
 [2,"מתחם מידטאון/דרך מנחם בגין",32.080071,34.795266],
 [3,"קניון עזריאלי/דרך מנחם בגין",32.074584,34.790607],
 [4,"ת.רק''ל יהודית/דרך מנחם בגין",32.070002,34.787954],
 [5,"ת.רק''ל קרליבך/דרך מנחם בגין A",32.065556,34.783121],
 [6,"ת. רכבת ההגנה/החרש",32.055692,34.783286],
 [7,"דרך קיבוץ גלויות/כביש 1",32.046861,34.784605],
 [8,"מחלף שורש",31.800293,35.077409],
 [9,"מחלף חמד",31.800330,35.126238],
 [10,"הראל/יסמין",31.799962,35.148045],
 [11,"תחנת משטרה/הראל",31.802479,35.149484],
 [12,"מרכז ספורט",31.804484,35.151863]];

const map = L.map("map").setView([32.0, 35.0], 9);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {maxZoom:19, attribution:"© OpenStreetMap"}).addTo(map);

const stopLayer = L.layerGroup().addTo(map);
const busLayer = L.layerGroup().addTo(map);
let routeLine = null, fitted = false;

function drawStops(){
  stopLayer.clearLayers();
  if (routeLine) map.removeLayer(routeLine);
  // Straight lines between stops (not the real road shape; the gap between stops 7 and 8 is the highway).
  routeLine = L.polyline(stops.map(s=>[s[2],s[3]]),{color:"#1565c0",weight:3,dashArray:"6 6"}).addTo(map);
  for (const s of stops){
    const k = s[1].includes("קרליבך");
    const m = L.circleMarker([s[2],s[3]],{radius:k?8:5,color:k?"#c60":"#1565c0",fillColor:k?"#ffe08a":"#fff",fillOpacity:1,weight:2})
      .bindTooltip(s[1],{permanent:k||stops.length<=12,direction:"right",className:"stoplbl"+(k?" k":"")})
      .addTo(stopLayer);
  }
  if(!fitted){ map.fitBounds(routeLine.getBounds().pad(0.1)); fitted = true; }
}

async function loadStops(){
  try{
    // newest ride of this line's route today -> its stops
    const today = new Date().toLocaleDateString("sv",{timeZone:"Asia/Jerusalem"});
    const rt = await getJSON("routes",`${API}/gtfs_routes/list?route_short_name=484&date_from=${today}&date_to=${today}&limit=10`);
    const route = rt.find(r=>r.line_ref===LINE_REF);
    if(!route) return;
    const rides = await getJSON("rides",`${API}/gtfs_rides/list?gtfs_route_id=${route.id}&limit=1&order_by=start_time%20desc`);
    if(!rides.length) return;
    const rs = await getJSON("stops",`${API}/gtfs_ride_stops/list?gtfs_ride_ids=${rides[0].id}&limit=200&order_by=stop_sequence%20asc`);
    log(`stops: ${rs.length} from API (ride ${rides[0].id})`);
    if(rs.length>3) stops = rs.map(r=>[r.stop_sequence,r.gtfs_stop__name,r.gtfs_stop__lat,r.gtfs_stop__lon]);
  }catch(e){ log("stops lookup failed, using built-in stops: "+e.message); }
}

async function probe(url){
  // no-cors request resolves (opaque) if the host is reachable even when CORS blocks reading it
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),10000);
  try{ await fetch(url,{mode:"no-cors",signal:ctl.signal}); log("probe: host reachable with no-cors => CORS is blocking reads (or response not readable)"); }
  catch(e){ log("probe: no-cors also failed ("+e.name+": "+e.message+") => network/DNS/firewall problem, not just CORS"); }
  finally{clearTimeout(t);}
}
async function getJSON(label,url,ms=20000){
  const t0=performance.now();
  log(`-> ${label} GET ${url}`);
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),ms);
  try{
    const res=await fetch(url,{signal:ctl.signal});
    const ttfb=Math.round(performance.now()-t0);
    log(`<- ${label} HTTP ${res.status} ${res.statusText} after ${ttfb}ms, type=${res.type}, content-type=${res.headers.get("content-type")}`);
    if(!res.ok) throw new Error(`${label}: HTTP ${res.status}`);
    const data=await res.json();
    log(`   ${label} parsed in ${Math.round(performance.now()-t0)}ms total, ${Array.isArray(data)?data.length+" items":typeof data}`);
    return data;
  }catch(e){
    const ms2=Math.round(performance.now()-t0);
    log(`!! ${label} failed after ${ms2}ms: ${e.name}: ${e.message}`);
    if(e.name==="AbortError") throw new Error(`${label}: timed out after ${ms/1000}s`);
    if(e instanceof TypeError){ probe(url); throw new Error(`${label}: ${e.message} (network error or blocked by CORS)`); }
    throw e;
  }finally{clearTimeout(t);}
}

function dist(a,b,c,d){const R=6371e3,t=Math.PI/180,dl=(c-a)*t,dn=(d-b)*t;
  const h=Math.sin(dl/2)**2+Math.cos(a*t)*Math.cos(c*t)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));}

async function refresh(){
  log("refresh start");
  const st = document.getElementById("status");
  try{
    const from = new Date(Date.now()-WINDOW_MIN*60000).toISOString();
    const url = `${API}/siri_vehicle_locations/list?siri_routes__line_ref=${LINE_REF}`+
      `&recorded_at_time_from=${encodeURIComponent(from)}&order_by=${encodeURIComponent("recorded_at_time desc")}&limit=200`;
    st.className=""; st.textContent="Fetching live positions…";
    const rows = await getJSON("positions",url);
    log(`positions: ${rows.length} rows; newest=${rows[0]?rows[0].recorded_at_time:"-"}; oldest=${rows.length?rows[rows.length-1].recorded_at_time:"-"}`);
    if(rows[0]) log("row keys: "+Object.keys(rows[0]).join(","));
    if(rows[0]) log("newest row: "+JSON.stringify(rows[0]));
    // keep newest fix per vehicle (field name for vehicle assumed: siri_ride__vehicle_ref; falls back to ride id)
    const latest = new Map();
    for(const r of rows){
      const key = r.siri_ride__vehicle_ref ?? r.siri_ride_id ?? "?";
      if(!latest.has(key)) latest.set(key,r);
    }
    log(`vehicles with a fix: ${latest.size} [${[...latest.keys()].join(", ")}]`);
    busLayer.clearLayers();
    const list = document.getElementById("buses"); list.innerHTML = "";
    const now = Date.now();
    let i = 0;
    for(const [key,r] of latest){
      i++;
      const ageMin = (now - new Date(r.recorded_at_time).getTime())/60000;
      let near = stops[0], nd = Infinity;
      for(const s of stops){const d=dist(r.lat,r.lon,s[2],s[3]); if(d<nd){nd=d;near=s;}}
      L.marker([r.lat,r.lon],{icon:L.divIcon({className:"",html:`<div class="busicon">${i}</div>`,iconSize:[26,26]}),opacity:ageMin>STALE_MIN?0.5:1})
        .bindTooltip(`Bus ${i}`).addTo(busLayer);
      const div = document.createElement("div"); div.className="bus";
      div.innerHTML = `<b>Bus ${i}</b> (ref ${key}) · speed ${r.velocity ?? "?"} · `+
        `<span class="${ageMin>STALE_MIN?"stale":""}">${ageMin.toFixed(1)} min ago</span><br>`+
        `Nearest stop: <span dir="rtl">${near[1]}</span> (${Math.round(nd)} m)`;
      list.appendChild(div);
    }
    log("refresh ok");
    const t = new Date().toLocaleTimeString("he-IL",{timeZone:"Asia/Jerusalem"});
    st.className = "";
    st.innerHTML = latest.size
      ? `${latest.size} bus(es) with a fix in the last ${WINDOW_MIN} min · updated ${t} · refreshes every 60s <button onclick="refresh()">Refresh now</button>`
      : `No fixes for line 484 (→Mevaseret) in the last ${WINDOW_MIN} min · checked ${t} <button onclick="refresh()">Refresh now</button>`;
  }catch(e){
    log("refresh failed: "+e.message);
    st.className = "err";
    st.innerHTML = `Could not load live data: ${e.name}: ${e.message}. Will retry in 60s. <button onclick="refresh()">Retry</button>`;
  }
}

drawStops();
refresh();
loadStops().then(drawStops);
setInterval(refresh, REFRESH_MS);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) refresh(); });
</script>
</body>
</html>
