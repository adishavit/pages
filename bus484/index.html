<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Line 484 live – Tel Aviv → Mevaseret Zion</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" onerror="this.onerror=null;this.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css'">
<style>
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,sans-serif}
  #map{position:absolute;inset:0 0 168px 0}
  #panel{position:absolute;left:0;right:0;bottom:0;height:168px;background:#fff;border-top:1px solid #ccc;
    padding:8px 12px calc(8px + env(safe-area-inset-bottom));box-sizing:border-box;overflow:auto;font-size:14px}
  #status{font-size:12px;color:#555;margin-bottom:6px}
  #status.err{color:#b00020}
  .bus{padding:4px 0;border-top:1px solid #eee}
  .bus b{font-size:15px}
  .bus.stale{color:#888}
  .busicon.old{background:#999}
  .stoplbl{background:#fff;border:1px solid #888;border-radius:3px;padding:0 3px;font-size:11px;white-space:nowrap;direction:rtl}
  .far .stoplbl.n{display:none}
  .stoplbl.e{font-weight:700}
  .stoplbl.k{background:#ffe08a;border-color:#c60;font-weight:700}
  .busicon{background:#d32f2f;color:#fff;border:2px solid #fff;border-radius:12px;min-width:44px;padding:1px 4px;box-sizing:border-box;
    text-align:center;font-weight:700;font-size:13px;line-height:15px;box-shadow:0 0 4px #000;white-space:nowrap;transform:translate(-50%,-50%);display:inline-block}
  .busicon small{display:block;font-size:10px;font-weight:400;line-height:11px}
  .busicon.live{background:#2e7d32}
  #ver{font-size:11px;color:#666;margin-bottom:4px}
  #panel.big{height:60vh} #map.big{bottom:60vh}
  details{margin-top:6px} summary{font-size:12px;color:#06c}
  #dbg{font:11px/1.35 ui-monospace,monospace;white-space:pre-wrap;word-break:break-all;background:#f5f5f5;padding:6px;margin:4px 0}
  #tools{position:absolute;top:10px;right:10px;z-index:1000;display:flex;gap:6px}
  #tools button{margin:0;font-size:15px;padding:6px 10px;background:#fff;border:1px solid #888;border-radius:6px}
  #tools button.on{background:#1565c0;color:#fff}
  .busicon.est{background:#fff;color:#d32f2f;border:2px dashed #d32f2f;opacity:.9}
  .meicon{width:16px;height:16px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 4px #000;box-sizing:border-box}
  .me{background:#e8f0fe;padding:4px;border-radius:4px}
  #msg{display:none;background:#fde7e9;border:1px solid #b00020;padding:6px;margin-bottom:6px;font-size:13px}
  button{font-size:13px;padding:4px 10px;margin-left:6px}
</style>
</head>
<body>
<div id="map"></div>
<div id="tools"><button id="btnMe">📍 Me</button><button id="btnFit">⤢ Route</button></div>
<div id="panel">
  <div id="upd" style="display:none;background:#fff3cd;border:1px solid #c90;padding:6px;margin-bottom:6px;font-size:13px"></div>
  <div id="msg"></div>
  <div id="ver"></div>
  <div id="status">Loading…</div>
  <div id="buses"></div>
  <details id="dbgwrap"><summary>Debug log</summary>
    <button onclick="copyLog()">Copy log</button>
    <pre id="dbg"></pre>
  </details>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>if(!window.L)document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"><\/script>')</script>
<script>
const VERSION = "v11";
const BUILD = "2026-11-24T18:07:33Z";   // UTC time this file was built/pushed
const PAGE_LOADED = Date.now();
const LOG = [];
function log(msg){
  const t = new Date().toISOString().slice(11,23);
  LOG.push(t+" "+msg); if(LOG.length>400) LOG.shift();
  const el=document.getElementById("dbg"); if(el) el.textContent=LOG.join("\n");
}
function copyLog(){
  const txt = verLine()+"\n"+LOG.join("\n");
  const sel=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById("dbg"));const w=getSelection();w.removeAllRanges();w.addRange(r);log("copy unavailable: text selected, use the system Copy");};
  try{ navigator.clipboard.writeText(txt).then(()=>log("log copied"),sel); }catch(e){ sel(); }
}
function fmt(sec){sec=Math.floor(sec);const m=Math.floor(sec/60);return m? m+"m"+(sec%60)+"s" : sec+"s";}
function verLine(){
  const buildAge=(Date.now()-new Date(BUILD).getTime())/1000;
  return `${VERSION} · built ${BUILD} (${fmt(buildAge)} ago) · page opened ${fmt((Date.now()-PAGE_LOADED)/1000)} ago`;
}
document.getElementById("dbgwrap").addEventListener("toggle",e=>{
  for(const id of ["panel","map"]) document.getElementById(id).classList.toggle("big",e.target.open);
  try{ if(map) setTimeout(()=>map.invalidateSize(),50); }catch(_){}
});
window.addEventListener("error",e=>log("JS error: "+e.message+" @"+(e.lineno||"?")));
window.addEventListener("unhandledrejection",e=>log("Unhandled rejection: "+(e.reason&&e.reason.message||e.reason)));
log(`start ${VERSION} build=${BUILD}`);
log(`UA: ${navigator.userAgent}`);
log(`online=${navigator.onLine} tz=${Intl.DateTimeFormat().resolvedOptions().timeZone} now=${new Date().toISOString()} origin=${location.origin}`);

const API = "https://open-bus-stride-api.hasadna.org.il";
const LINE_REF = 19094;            // line 484, Tel Aviv Savidor -> Mevaseret Zion (Tnufa), looked up for 2026-11-24
const REFRESH_MS = 60000;
const FIRST_WINDOW_MIN = 30;       // Stride lags real time by ~7-15 min (measured 2026-11-24), so first look-back must exceed that
const KEEP_MIN = 30;               // forget a vehicle whose last fix is this much older than the newest data
const STALE_MIN = 5;               // a bus this far behind the newest data is probably finished / not transmitting
const TIMEOUT_MS = 30000;
const LIMIT = 500;
const HAVE_MAP = typeof L !== "undefined";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tms = r => Date.parse(r.recorded_at_time);
const hhmm = ms => new Date(ms).toLocaleTimeString("he-IL",{timeZone:"Asia/Jerusalem",hour:"2-digit",minute:"2-digit",second:"2-digit"});

// Stops from GTFS ride 164125712 (2026-11-24). Fallback; replaced from the API at load if that works.
let stops = [
 [1,"ת. רכבת תל אביב- סבידור/רציפים A",32.083157,34.796089,20001],
 [2,"מתחם מידטאון/דרך מנחם בגין",32.080071,34.795266,21705],
 [3,"קניון עזריאלי/דרך מנחם בגין",32.074584,34.790607,21472],
 [4,"ת.רק''ל יהודית/דרך מנחם בגין",32.070002,34.787954,20728],
 [5,"ת.רק''ל קרליבך/דרך מנחם בגין A",32.065556,34.783121,20750],
 [6,"ת. רכבת ההגנה/החרש",32.055692,34.783286,20353],
 [7,"דרך קיבוץ גלויות/כביש 1",32.046861,34.784605,25069],
 [8,"מחלף שורש",31.800293,35.077409,5524],
 [9,"מחלף חמד",31.800330,35.126238,640],
 [10,"הראל/יסמין",31.799962,35.148045,5664],
 [11,"תחנת משטרה/הראל",31.802479,35.149484,5827],
 [12,"מרכז ספורט",31.804484,35.151863,2454]];

let map=null, stopLayer=null, busLayer=null, routeLine=null, fitted=false;
if (HAVE_MAP){
  map = L.map("map").setView([32.0, 35.0], 9);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19, attribution:"© OpenStreetMap"}).addTo(map);
  stopLayer = L.layerGroup().addTo(map);
  busLayer = L.layerGroup().addTo(map);
  const zoomCls = () => map.getContainer().classList.toggle("far", map.getZoom() < 12);
  map.on("zoomend", zoomCls); zoomCls();
} else {
  log("Leaflet failed to load from both CDNs: map disabled, list still works");
  $("map").innerHTML = '<p style="padding:1em">Map library failed to load. Bus list below still updates.</p>';
}

function drawStops(){
  setRoute(road || stops.map(s=>[s[2],s[3]]));
  if(!HAVE_MAP) return;
  stopLayer.clearLayers();
  if (routeLine) map.removeLayer(routeLine);
  // Road geometry from OSRM if loaded, else straight lines between stops (dashed).
  routeLine = L.polyline(routePts,{color:"#1565c0",weight:road?4:3,opacity:road?.7:1,dashArray:road?null:"6 6"}).addTo(stopLayer);
  stops.forEach((s,idx)=>{
    const k = s[1].includes("קרליבך");
    const end = idx===0 || idx===stops.length-1;
    L.circleMarker([s[2],s[3]],{radius:k?8:5,color:k?"#c60":"#1565c0",fillColor:k?"#ffe08a":"#fff",fillOpacity:1,weight:2})
      .bindTooltip(esc(s[1]),{permanent:true,direction:"right",className:"stoplbl"+(k?" k":end?" e":" n")})
      .addTo(stopLayer);
  });
  if(!fitted){ map.fitBounds(routeLine.getBounds().pad(0.1)); fitted = true; }
}

async function loadStops(){
  try{
    const today = new Date().toLocaleDateString("sv",{timeZone:"Asia/Jerusalem"});
    const rt = await getJSON("routes",`${API}/gtfs_routes/list?route_short_name=484&date_from=${today}&date_to=${today}&limit=10`);
    const route = rt.find(r=>r.line_ref===LINE_REF);
    if(!route){ log("stops: line_ref not in today's GTFS routes, keeping built-in stops"); return; }
    const rides = await getJSON("rides",`${API}/gtfs_rides/list?gtfs_route_id=${route.id}&limit=1`);
    if(!rides.length){ log("stops: no GTFS rides today, keeping built-in stops"); return; }
    const rs = await getJSON("stops",`${API}/gtfs_ride_stops/list?gtfs_ride_ids=${rides[0].id}&limit=200`);
    rs.sort((a,b)=>a.stop_sequence-b.stop_sequence);
    const ok = rs.filter(r=>Number.isFinite(r.gtfs_stop__lat)&&Number.isFinite(r.gtfs_stop__lon));
    log(`stops: ${ok.length}/${rs.length} valid from API (ride ${rides[0].id})`);
    if(ok.length>3){ stops = ok.map(r=>[r.stop_sequence,r.gtfs_stop__name,r.gtfs_stop__lat,r.gtfs_stop__lon,r.gtfs_stop__code]); road=null; drawStops(); render(); loadRoad(); }
  }catch(e){ log("stops lookup failed, using built-in stops: "+e.message); }
}

async function probe(url){
  // no-cors resolves (opaque) if the host is reachable even when CORS blocks reading it
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),10000);
  try{ await fetch(url,{mode:"no-cors",signal:ctl.signal,cache:"no-store"}); log("probe: host reachable with no-cors => CORS is blocking reads"); }
  catch(e){ log("probe: no-cors also failed ("+e.name+": "+e.message+") => network/DNS/firewall problem"); }
  finally{clearTimeout(t);}
}
async function getJSON(label,url,ms=TIMEOUT_MS,wantArray=true,headers={}){
  const t0=performance.now();
  log(`-> ${label} GET ${url}`);
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),ms);
  try{
    const res=await fetch(url,{signal:ctl.signal,cache:"no-store",headers});
    log(`<- ${label} HTTP ${res.status} after ${Math.round(performance.now()-t0)}ms, type=${res.type}`);
    if(!res.ok) throw new Error(`${label}: HTTP ${res.status}`);
    const data=await res.json();
    if(wantArray&&!Array.isArray(data)) throw new Error(`${label}: expected a JSON array, got ${typeof data}`);
    log(`   ${label} ${Array.isArray(data)?data.length+" items":"object"}, ${Math.round(performance.now()-t0)}ms total`);
    return data;
  }catch(e){
    log(`!! ${label} failed after ${Math.round(performance.now()-t0)}ms: ${e.name}: ${e.message}`);
    if(e.name==="AbortError") throw new Error(`${label}: timed out after ${ms/1000}s`);
    if(e instanceof TypeError){ probe(url); throw new Error(`${label}: ${e.message} (network error or blocked by CORS)`); }
    throw e;
  }finally{clearTimeout(t);}
}

function dist(a,b,c,d){const R=6371e3,t=Math.PI/180,dl=(c-a)*t,dn=(d-b)*t;
  const h=Math.sin(dl/2)**2+Math.cos(a*t)*Math.cos(c*t)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));}

// ---- route geometry (road shape via OSRM), snapping and projection ----
let road=null, routePts=[], routeCum=[0];
function setRoute(pts){
  routePts=pts; routeCum=[0];
  for(let i=1;i<pts.length;i++) routeCum.push(routeCum[i-1]+dist(pts[i-1][0],pts[i-1][1],pts[i][0],pts[i][1]));
}
function snap(lat,lon){            // nearest point on route: {along (m from start), d (m off route)}
  let best={along:0,d:Infinity};
  const kx=Math.cos(lat*Math.PI/180)*111320, ky=110540;
  for(let i=1;i<routePts.length;i++){
    const [ay,ax]=routePts[i-1],[by,bx]=routePts[i];
    const ux=(bx-ax)*kx, uy=(by-ay)*ky, px=(lon-ax)*kx, py=(lat-ay)*ky, L2=ux*ux+uy*uy;
    const t=L2?Math.max(0,Math.min(1,(px*ux+py*uy)/L2)):0, d=Math.hypot(px-t*ux,py-t*uy);
    if(d<best.d) best={d,along:routeCum[i-1]+t*(routeCum[i]-routeCum[i-1])};
  }
  return best;
}
function pointAt(a){
  a=Math.max(0,Math.min(a,routeCum[routeCum.length-1]));
  let i=1; while(i<routeCum.length-1&&routeCum[i]<a) i++;
  const seg=routeCum[i]-routeCum[i-1], t=seg?(a-routeCum[i-1])/seg:0, A=routePts[i-1], B=routePts[i];
  return [A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t];
}
function slice(a,b){
  const out=[pointAt(a)];
  for(let i=0;i<routeCum.length;i++) if(routeCum[i]>a&&routeCum[i]<b) out.push(routePts[i]);
  out.push(pointAt(b)); return out;
}
function nearestStop(lat,lon){let n=stops[0],nd=Infinity;for(const s of stops){const d=dist(lat,lon,s[2],s[3]);if(d<nd){nd=d;n=s;}}return [n,nd];}
async function loadRoad(){
  const key="road484:"+stops.map(s=>(+s[2]).toFixed(4)+","+(+s[3]).toFixed(4)).join(";");
  try{ const c=localStorage.getItem(key); if(c){ road=JSON.parse(c); log(`road: ${road.length} pts from cache`); drawStops(); render(); return; } }catch(_){}
  try{
    const coords=stops.map(s=>s[3]+","+s[2]).join(";");
    const d=await getJSON("road",`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson`,TIMEOUT_MS,false);
    if(d.code!=="Ok"||!d.routes||!d.routes[0]) throw new Error("OSRM code "+d.code);
    road=d.routes[0].geometry.coordinates.map(([x,y])=>[y,x]);
    log(`road: ${road.length} pts, ${(d.routes[0].distance/1000).toFixed(1)} km (OSRM car routing through the stops)`);
    try{ localStorage.setItem(key,JSON.stringify(road)); }catch(_){}
    drawStops(); render();
  }catch(e){ log("road geometry failed, keeping straight lines: "+e.message); }
}

// ---- my location (needs https) ----
let me=null, meWatch=null, meLayer=HAVE_MAP?L.layerGroup().addTo(map):null, meCentered=false;
function showMsg(t){ const m=$("msg"); m.style.display=t?"block":"none"; m.innerHTML=t||""; }
function toggleMe(){
  const btn=$("btnMe");
  if(meWatch!==null){ navigator.geolocation.clearWatch(meWatch); meWatch=null; me=null; btn.classList.remove("on"); if(meLayer) meLayer.clearLayers(); render(); log("location off"); return; }
  if(!window.isSecureContext){
    const u="https://"+location.host+location.pathname;
    showMsg(`Location needs HTTPS. Open <a href="${esc(u)}">${esc(u)}</a> (in GitHub: Settings → Pages → Enforce HTTPS).`);
    log("location blocked: page is not a secure context ("+location.protocol+")"); return;
  }
  if(!navigator.geolocation){ showMsg("This browser has no location support."); return; }
  btn.classList.add("on"); meCentered=false; showMsg("");
  meWatch=navigator.geolocation.watchPosition(p=>{
    me={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy,t:p.timestamp};
    if(HAVE_MAP){
      meLayer.clearLayers();
      L.circle([me.lat,me.lon],{radius:me.acc,color:"#1a73e8",weight:1,fillOpacity:.1}).addTo(meLayer);
      L.marker([me.lat,me.lon],{icon:L.divIcon({className:"",html:'<div class="meicon"></div>',iconSize:[16,16],iconAnchor:[8,8]})}).addTo(meLayer);
      if(!meCentered){ map.setView([me.lat,me.lon],13); meCentered=true; }
    }
    render();
  },e=>{ log("location error "+e.code+": "+e.message); showMsg("Location error: "+esc(e.message)); btn.classList.remove("on"); meWatch=null; },
  {enableHighAccuracy:true,maximumAge:10000,timeout:30000});
  log("location on");
}
$("btnMe").addEventListener("click",toggleMe);
$("btnFit").addEventListener("click",()=>{ if(HAVE_MAP&&routeLine) map.fitBounds(routeLine.getBounds().pad(0.1)); });

// ---- state: fixes accumulate across refreshes; later refreshes fetch only what is new ----
const vehicles = new Map();   // vehicle ref -> Map(fix id -> row)
let newestMs = null;          // newest fix seen from any source (data time, not phone time)
let strideNewestMs = null;    // newest Stride fix (Stride query cursor; Stride lags ~10 min)
const rideStart = new Map();  // vehicle ref -> scheduled trip start (ms), from Stride
// Live source: curlbus.app relays the Ministry's real-time SIRI feed. Override with ?relay=https://... (remembered).
let LIVE_BASE = "https://shiny-shadow-cc40.adishavit.workers.dev";   // your Cloudflare relay to curlbus.app (CORS); ?relay= overrides
try{ const q=new URLSearchParams(location.search).get("relay"); if(q){ localStorage.setItem("relay484",q); } const r=localStorage.getItem("relay484"); if(r) LIVE_BASE=r.replace(/\/$/,""); }catch(_){}
let liveState="untried", liveRetryAt=0, liveOkMs=null;
let inFlight=false, timer=null, lastRun=0, nextAt=0, okCount=0, failCount=0;

function q(fromMs,toMs){
  return `${API}/siri_vehicle_locations/list?siri_routes__line_ref=${LINE_REF}`+
    `&recorded_at_time_from=${encodeURIComponent(new Date(fromMs).toISOString())}`+
    `&recorded_at_time_to=${encodeURIComponent(new Date(toMs).toISOString())}&limit=${LIMIT}`;
}
async function fetchPositions(){
  const now=Date.now(), to=now+5*60000;     // 5 min margin for phone clock skew
  if(strideNewestMs){                       // incremental: from 1 min before the newest Stride fix
    const from=Math.max(strideNewestMs-60000, now-FIRST_WINDOW_MIN*60000);
    return getJSON("positions-incremental", q(from,to));
  }
  try{ return await getJSON(`positions-${FIRST_WINDOW_MIN}min`, q(now-FIRST_WINDOW_MIN*60000,to)); }
  catch(e){
    if(!/timed out/.test(e.message)) throw e;
    return getJSON("positions-20min", q(now-20*60000,to));   // still longer than the observed lag
  }
}
// curlbus fails on multi-stop requests ("a+b"), so query a few stops one by one.
// A SIRI stop query returns buses heading to that stop, so stops spread along the route (ending at the terminus) cover the trip.
// Every refresh: terminus + Shoresh (together they see buses heading out of TLV and on the highway),
// plus one rotating stop. Max 2 requests at a time, generous timeout: curlbus is a slow hobby server.
const LIVE_FIXED = [12, 8], LIVE_ROTATE = [5, 7, 10];
let liveTurn = 0, liveLastErr = "";
function parseTs(x){ const t=Date.parse(String(x||"").replace(" ","T")); return Number.isFinite(t)?t:NaN; }
async function fetchLive(){
  if(Date.now()<liveRetryAt) return null;
  const seqs=[...LIVE_FIXED, LIVE_ROTATE[liveTurn++ % LIVE_ROTATE.length]];
  const codes=seqs.map(q=>stops.find(s=>s[0]===q)).filter(s=>s&&s[4]).map(s=>s[4]);
  if(!codes.length){ log("live: no stop codes"); return null; }
  const res=[];
  for(let i=0;i<codes.length;i+=2){   // at most 2 in flight
    const part=await Promise.allSettled(codes.slice(i,i+2).map(c=>getJSON(`live-${c}`,`${LIVE_BASE}/${c}`,25000,false,{Accept:"application/json"})));
    res.push(...part);
  }
  const okRes=res.filter(r=>r.status==="fulfilled").map(r=>r.value);
  const fails=res.filter(r=>r.status==="rejected").map(r=>r.reason.message);
  if(!okRes.length){
    liveState=fails.some(m=>/CORS|network/.test(m))?"blocked":"error";
    liveLastErr=fails[0]||"";
    liveRetryAt=Date.now()+2*60000;
    log(`live source ${liveState}: all ${codes.length} stop queries failed (${fails[0]}). Stride only; retry in 2 min.`);
    return null;
  }
  if(fails.length) log(`live: ${fails.length}/${codes.length} stop queries failed (ignored)`);
  const best=new Map(); let total=0, noLoc=0;
  for(const d of okRes){
    if(d&&d.errors) log("live: source errors: "+JSON.stringify(d.errors).slice(0,200));
    const respMs=parseTs(d&&d.timestamp);
    for(const code in (d&&d.visits)||{}) for(const v of d.visits[code]||[]){
      total++;
      if(String(v.line_id)!==String(LINE_REF)) continue;
      if(!v.location){ noLoc++; continue; }
      // visit timestamps are sometimes hours off; trust them only if within 10 min before the response time
      let ms=parseTs(v.timestamp);
      if(!Number.isFinite(ms) || (Number.isFinite(respMs) && (ms<respMs-10*60000 || ms>respMs+60000))) ms=respMs;
      if(!Number.isFinite(ms)) continue;
      const vr=String(v.vehicle_ref ?? ("trip:"+v.trip_id));
      const row={id:`L:${vr}:${ms}`,live:true,recorded_at_time:new Date(ms).toISOString(),lat:+v.location.lat,lon:+v.location.lon,
        velocity:null,siri_ride__vehicle_ref:vr,eta:v.eta,stop:code};
      if(!best.has(vr)||ms>tms(best.get(vr))) best.set(vr,row);
    }
  }
  const out=[...best.values()];
  log(`live: ${total} visits from ${okRes.length} stops; 484 →Mevaseret: ${out.length} with position, ${noLoc} without (not yet departed)`);
  liveState="ok"; liveOkMs=Date.now(); liveLastErr=fails.length?`${fails.length}/${codes.length} stops failed`:"";
  return out;
}

function merge(rows){
  let added=0;
  for(const r of rows){
    if(!Number.isFinite(r.lat)||!Number.isFinite(r.lon)||!Number.isFinite(tms(r))||(r.lat===0&&r.lon===0)) continue;
    const ref=String(r.siri_ride__vehicle_ref ?? r.siri_ride__id ?? "?");
    if(!vehicles.has(ref)) vehicles.set(ref,new Map());
    const m=vehicles.get(ref); if(!m.has(r.id)) added++;
    m.set(r.id,r);
    if(newestMs===null||tms(r)>newestMs) newestMs=tms(r);
    if(!r.live){
      if(strideNewestMs===null||tms(r)>strideNewestMs) strideNewestMs=tms(r);
      const st=Date.parse(r.siri_ride__scheduled_start_time); if(Number.isFinite(st)) rideStart.set(ref,st);
    }
  }
  if(newestMs!==null){
    const cutoff=newestMs-KEEP_MIN*60000;
    for(const [ref,m] of vehicles){
      for(const [id,f] of m) if(tms(f)<cutoff) m.delete(id);
      if(!m.size) vehicles.delete(ref);
    }
  }
  return added;
}

function render(){
  if(HAVE_MAP) busLayer.clearLayers();
  const list=$("buses"); list.textContent="";
  const now=Date.now();
  const vs=[...vehicles].map(([ref,m])=>{const fx=[...m.values()].sort((a,b)=>tms(a)-tms(b));return {ref,fx,last:fx[fx.length-1]};})
    .sort((a,b)=>tms(b.last)-tms(a.last));
  const meSnap = me ? snap(me.lat,me.lon) : null;
  if(me){
    const [ns,nd]=nearestStop(me.lat,me.lon);
    const div=document.createElement("div"); div.className="bus me";
    div.innerHTML=`<b>📍 You</b> (±${Math.round(me.acc)} m) · ${(meSnap.along/1000).toFixed(1)} km along route`+
      `${meSnap.d>300?` · <b>${(meSnap.d/1000).toFixed(1)} km off route</b>`:""}<br>Nearest stop: <span dir="rtl">${esc(ns[1])}</span> (${Math.round(nd)} m)`;
    list.appendChild(div);
  }
  for(const v of vs){
    const r=v.last, behind=((r.live?newestMs:(strideNewestMs??newestMs))-tms(r))/60000, stale=behind>STALE_MIN;  // compare with own source
    const dep=rideStart.has(v.ref)?new Date(rideStart.get(v.ref)).toLocaleTimeString("he-IL",{timeZone:"Asia/Jerusalem",hour:"2-digit",minute:"2-digit"}):"";
    const label=`484${dep?`<small>${dep} dep.</small>`:""}`, name=`484${dep?" ("+dep+" departure)":""}`;
    const [near,nd]=nearestStop(r.lat,r.lon);
    // estimate: progress along the route at this bus's recent average speed, for the time since its last fix
    let est=null;
    if(!stale && routePts.length>1){
      const s1=snap(r.lat,r.lon);
      const ref=v.fx.find(f=>tms(r)-tms(f)<=10*60000);
      let sp=0;
      if(ref&&ref!==r){ const dt=(tms(r)-tms(ref))/1000; if(dt>=90) sp=Math.max(0,(s1.along-snap(ref.lat,ref.lon).along)/dt); }
      sp=Math.min(sp,25);  // cap at 90 km/h
      const ageS=Math.max(0,(now-tms(r))/1000);
      const a=Math.min(routeCum[routeCum.length-1], s1.along+sp*ageS);
      est={along:a, from:s1.along, p:pointAt(a), kmh:sp*3.6, ageMin:ageS/60};
    }
    if(HAVE_MAP){
      if(v.fx.length>1) L.polyline(v.fx.map(f=>[f.lat,f.lon]),{color:stale?"#999":"#d32f2f",weight:3,opacity:.6}).addTo(busLayer);
      L.marker([r.lat,r.lon],{icon:L.divIcon({className:"",html:`<div class="busicon${stale?" old":r.live?" live":""}">${label}</div>`,iconSize:[0,0],iconAnchor:[0,0]})})
        .bindTooltip(`${esc(name)}: last fix ${hhmm(tms(r))}${r.live?" (live)":" (Stride)"}`).addTo(busLayer);
      if(est && est.along-est.from>50){
        L.polyline(slice(est.from,est.along),{color:"#d32f2f",weight:3,dashArray:"4 6"}).addTo(busLayer);
        L.marker(est.p,{icon:L.divIcon({className:"",html:`<div class="busicon est">${label}<small>est.</small></div>`,iconSize:[0,0],iconAnchor:[0,0]})})
          .bindTooltip(`${esc(name)}: ESTIMATED now`).addTo(busLayer);
      }
    }
    let estTxt="";
    if(est && est.along-est.from>50){
      const [es]=nearestStop(est.p[0],est.p[1]);
      estTxt=`<br>Est. now (${est.kmh.toFixed(0)} km/h avg × ${est.ageMin.toFixed(0)} min): ${(est.along/1000).toFixed(1)} km along, near <span dir="rtl">${esc(es[1])}</span>`;
      if(meSnap) estTxt+=` · <b>${((est.along-meSnap.along)/1000).toFixed(1)} km ${est.along>=meSnap.along?"ahead of":"behind"} you</b>`;
    }
    const div=document.createElement("div"); div.className="bus"+(stale?" stale":"");
    div.innerHTML=`<b>${esc(name)}</b> · ${r.live?"🟢 live":"Stride"} fix ${hhmm(tms(r))}${r.velocity!=null?`, ${esc(r.velocity)} km/h?`:""} · <small>vehicle ${esc(v.ref)}</small>`+
      `${stale?` · <b>no update for ${behind.toFixed(0)} min</b>`:""}<br>`+
      `At fix: near <span dir="rtl">${esc(near[1])}</span> (${Math.round(nd)} m)`+estTxt;
    list.appendChild(div);
  }
  return vs.length;
}

function schedule(ms){ clearTimeout(timer); nextAt=Date.now()+ms; timer=setTimeout(refresh, ms); }

async function refresh(){
  if(inFlight){ log("refresh skipped: one already running"); return; }
  inFlight=true; clearTimeout(timer); nextAt=0; lastRun=Date.now();
  const st=$("status");
  log("refresh start");
  st.className=""; st.textContent = newestMs ? "Updating…" : `Fetching positions (last ${FIRST_WINDOW_MIN} min)…`;
  try{
    const [sr,lr]=await Promise.allSettled([fetchPositions(),fetchLive()]);
    const liveRows=lr.status==="fulfilled"&&lr.value?lr.value:[];
    if(sr.status==="rejected" && !liveRows.length) throw sr.reason;
    const rows=(sr.status==="fulfilled"?sr.value:[]).concat(liveRows);
    if(sr.status==="rejected") log("Stride failed but live source worked: "+sr.reason.message);
    if(rows.length>=LIMIT) log(`WARNING: hit limit ${LIMIT}; some fixes may be missing`);
    const added=merge(rows);
    if(rows[0] && okCount===0) log("row keys: "+Object.keys(rows[0]).join(","));
    const n=render(); okCount++;
    const lag = newestMs ? ((Date.now()-newestMs)/60000).toFixed(0) : null;
    log(`refresh ok: ${rows.length} rows, ${added} new, ${n} vehicles, newest=${newestMs?new Date(newestMs).toISOString():"-"}`);
    st.innerHTML = (n
      ? `<b>${n} bus(es)</b> · data as of ${hhmm(newestMs)} (<b>${lag} min behind now</b>) · live feed: ${liveState==="ok"?"✅":liveState==="untried"?"…":"❌ "+liveState+" (Stride only)"}${liveLastErr?` <small>[${esc(liveLastErr)}]</small>`:""} · relay: ${esc(LIVE_BASE.replace(/^https?:\/\//,""))}`
      : `No buses on line 484 (→Mevaseret) in the last ${KEEP_MIN} min of data${newestMs?` · data as of ${hhmm(newestMs)}`:""}`)
      + ` · checked ${hhmm(Date.now())} <button onclick="refresh()">Refresh now</button>`;
  }catch(e){
    failCount++;
    log("refresh failed: "+e.message);
    st.className="err";
    st.innerHTML=`Could not load live data: ${esc(e.message)}. Retrying in 60s.${vehicles.size?" Showing last known positions.":""} <button onclick="refresh()">Retry</button>`;
  }finally{
    inFlight=false;
    if(!document.hidden) schedule(REFRESH_MS);
  }
}

setInterval(()=>{ const e=$("ver"); if(e) e.textContent=verLine()+
  ` · ok ${okCount}/fail ${failCount}`+(inFlight?" · fetching…":nextAt?` · next in ${Math.max(0,Math.round((nextAt-Date.now())/1000))}s`:""); },1000);

document.addEventListener("visibilitychange",()=>{
  if(document.hidden){ clearTimeout(timer); nextAt=0; log("page hidden: paused"); return; }
  log("page visible");
  if(inFlight) return;
  const since=Date.now()-lastRun;
  since>15000 ? refresh() : schedule(REFRESH_MS-since);
});
window.addEventListener("online",()=>{ log("browser online"); if(!inFlight) refresh(); });
window.addEventListener("offline",()=>log("browser offline"));

// new-version check: version.json is fetched uncached; if it differs, offer a cache-busting reload
async function checkVersion(){
  try{
    const res=await fetch("version.json?t="+Date.now(),{cache:"no-store"});
    if(!res.ok){ log("version check: HTTP "+res.status); return; }
    const v=(await res.json()).version;
    if(v && v!==VERSION){
      log(`version check: server has ${v}, running ${VERSION}`);
      const u=$("upd"); u.style.display="block";
      u.innerHTML=`New version ${esc(v)} available (you have ${VERSION}). <button onclick="location.replace(location.pathname+'?v='+encodeURIComponent('${esc(v)}'))">Reload</button>`;
    }
  }catch(e){ log("version check failed: "+e.message); }
}
setInterval(checkVersion, 5*60000);

drawStops();
refresh();
loadStops();
loadRoad();
checkVersion();
</script>
